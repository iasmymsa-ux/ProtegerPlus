name: Build iOS IPA (iPhone e iPad)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios:
    name: Compilar Proteger+ para iPhone e iPad
    runs-on: macos-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Instalar dependências do Flutter
        run: flutter pub get

      - name: Compilar App para iOS (iPhone e iPad)
        run: |
          flutter build ios --release --no-codesign

      - name: Empacotar Payload IPA
        run: |
          mkdir -p build/ios/iphone_ipad/Payload
          cp -r build/ios/iphone/Release-iphoneos/Runner.app build/ios/iphone_ipad/Payload/ 2>/dev/null || cp -r build/ios/Release-iphoneos/Runner.app build/ios/iphone_ipad/Payload/
          cd build/ios/iphone_ipad
          zip -r ProtegerPlus_iOS.ipa Payload
          cd ../../..

      - name: Salvar IPA para Download
        uses: actions/upload-artifact@v4
        with:
          name: ProtegerPlus_iOS_iPad_iPhone
          path: build/ios/iphone_ipad/ProtegerPlus_iOS.ipa
          retention-days: 14

